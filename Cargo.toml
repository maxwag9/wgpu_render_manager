[package]
name = "wgpu_render_manager"
version = "30.0.13"
edition = "2024"

authors = ["Maxim Wagner"]
license = "MIT"
description = "Cached Render/Compute Manager for wgpu (pipelines + bind groups + procedural textures automated)"
repository = "https://github.com/maxwag9/wgpu_render_manager"
documentation = "https://docs.rs/wgpu_render_manager"

keywords = ["wgpu", "graphics", "rendering", "compute", "gpu"]
categories = ["graphics", "rendering", "game-development"]

[dependencies]
wgpu = "30"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
revision = "0.30.0"
block_compression = { version = "0.11", default-features = false, features = ["bc7", "wgpu"] }
tracing = "0.1"